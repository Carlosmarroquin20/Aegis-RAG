---
# Development stack: Aegis-RAG API + ChromaDB + Ollama
# For production, replace hardcoded keys with secrets management.
#
# Every published port is bound to 127.0.0.1. With the bare "HOST:CONTAINER" form
# Docker listens on all interfaces, which on a laptop means anyone on the same
# network can reach services that have no authentication of their own here:
# ChromaDB and Ollama outright, Prometheus (including its lifecycle endpoint) and
# Grafana with default admin credentials. Loopback keeps every URL in the README
# working while matching the deployment assumption in SECURITY.md that ChromaDB
# is never exposed to untrusted clients.
#
# The API and Grafana are the two services meant to be reachable on a server, so
# their bind address is configurable: set AEGIS_PUBLIC_BIND=0.0.0.0 (the Terraform
# bootstrap does) and let the host firewall / security group decide who gets in.
# Everything else stays on loopback regardless.

services:
  api:
    build:
      context: .
      target: runtime
      # The model is baked into the image and loaded offline, so the build and
      # the container must name the same one.
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    ports:
      - "${AEGIS_PUBLIC_BIND:-127.0.0.1}:8000:8000"
    environment:
      - DEBUG=true
      - LOG_FORMAT=console
      - LOG_LEVEL=DEBUG
      - VALID_API_KEYS=dev-key-change-in-production
      - SECURITY_STRICT_MODE=true
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      # LLM backend. Defaults to the local Ollama service above. To use a hosted,
      # OpenAI-compatible provider instead, set these four in .env (git-ignored);
      # compose interpolates them here. See .env.example.
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_INPUT_PRICE_PER_MTOK=${LLM_INPUT_PRICE_PER_MTOK:-0}
      - LLM_OUTPUT_PRICE_PER_MTOK=${LLM_OUTPUT_PRICE_PER_MTOK:-0}
      - LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER:-}
      - LLM_CIRCUIT_FAILURE_THRESHOLD=${LLM_CIRCUIT_FAILURE_THRESHOLD:-3}
      - LLM_CIRCUIT_RESET_SECONDS=${LLM_CIRCUIT_RESET_SECONDS:-30}
      # Share the rate-limit window across workers via Redis (swappable backend).
      - RATE_LIMIT_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      # Export spans to the OpenTelemetry Collector over OTLP/HTTP. The collector
      # forwards them to Jaeger (trace UI at http://localhost:16686) and derives
      # span metrics for Grafana.
      - TRACING_ENABLED=true
      - OTEL_EXPORTER=otlp
      - OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=aegis-rag
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    volumes:
      # Mount source for live reload during development.
      - ./src:/app/src:ro
    networks:
      - aegis-net
    restart: unless-stopped

  # Demo web console (React SPA served by nginx, which reverse-proxies /api to
  # the API — so the browser sees a single origin at http://localhost:8080).
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    networks:
      - aegis-net
    restart: unless-stopped

  chromadb:
    # Must match the chromadb client version resolved in uv.lock (1.5.x); an
    # older server rejects the client's collection API with KeyError('_type').
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - aegis-net
    healthcheck:
      # The chroma 1.5.x image is near-distroless: no curl, wget, or python on
      # PATH — only bash. Probe the HTTP heartbeat with bash's built-in /dev/tcp
      # and assert a real 200, so `condition: service_healthy` gates the API
      # start on Chroma actually answering, not merely the port being open.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/localhost/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      # Published only for convenience (e.g. `ollama list` from the host); the API
      # reaches Ollama over the compose network. The host port is configurable
      # because a natively installed Ollama already listens on 127.0.0.1:11434,
      # and the two cannot share it: set OLLAMA_HOST_PORT=11435 in that case.
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - aegis-net
    environment:
      # Keep the model in memory instead of unloading it after five idle minutes.
      # Loading it from the volume took about 3.5 minutes on a laptop's Docker
      # VM, longer than OLLAMA_TIMEOUT_SECONDS. As the default backend that
      # would fail the first query after every quiet spell; as a fallback, which
      # sits idle by definition, it would fail exactly when it is needed. The
      # cost is the model's memory (about 2.5 GB for llama3.2) held permanently.
      - OLLAMA_KEEP_ALIVE=-1
    # Pull the default model on first startup, then load it with a one-word
    # prompt so the first real query does not pay for the load.
    entrypoint:
      - /bin/sh
      - -c
      - ollama serve & sleep 5 && ollama pull llama3.2 && ollama run llama3.2 ok >/dev/null && wait
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # Not published to the host — only the API needs it, over the internal network.
    volumes:
      - redis-data:/data
    networks:
      - aegis-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Tracing backend ─────────────────────────────────────────────────────────
  # Jaeger receives OTLP spans from the collector and serves the trace UI. This is
  # Jaeger v2, built on the OpenTelemetry Collector; v1 (all-in-one) is end of life.
  # The image's default configuration is the all-in-one one: OTLP on 4317/4318,
  # in-memory storage (100k traces), UI and query API on 16686, all listening on
  # 0.0.0.0 inside the container (JAEGER_LISTEN_HOST is set by the image).
  # Held at 2.20: 2.21 removed GET /api/services and trace search from the HTTP
  # JSON API, and Grafana's Jaeger datasource still uses both unless an
  # experimental feature toggle is on. Traces would arrive, but Explore search
  # and the datasource health check would fail. See .github/dependabot.yml.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
      # OTLP receivers (4317 gRPC / 4318 HTTP) stay on the internal network.
    networks:
      - aegis-net
    restart: unless-stopped

  # OTLP hub: receives spans from the API, forwards traces to Jaeger, and derives
  # span metrics (RED per pipeline stage) that Prometheus scrapes at :8889.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "127.0.0.1:8889:8889" # span-derived metrics (scraped by Prometheus)
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - aegis-net
    restart: unless-stopped

  # ── Observability stack ─────────────────────────────────────────────────────
  # Prometheus scrapes the API /metrics endpoint; Grafana ships with a
  # pre-provisioned dashboard and Prometheus datasource, so `docker compose up`
  # yields a fully working monitoring view at http://localhost:3000.

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
      # Store exemplars so a latency spike in Grafana links to its trace in Jaeger.
      # created-timestamp-zero-ingestion: a counter's first scrape also records a
      # zero at its creation time, so increase() includes what it counted before
      # Prometheus first saw it. Without it a cost panel misses the first answers
      # after every API restart.
      - "--enable-feature=exemplar-storage,created-timestamp-zero-ingestion"
    networks:
      - aegis-net
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "${AEGIS_PUBLIC_BIND:-127.0.0.1}:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - aegis-net
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  chroma-data:
  ollama-models:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  aegis-net:
    driver: bridge
