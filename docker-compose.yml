---
# Development stack: Aegis-RAG API + ChromaDB + Ollama
# For production, replace hardcoded keys with secrets management.

services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - LOG_FORMAT=console
      - LOG_LEVEL=DEBUG
      - VALID_API_KEYS=dev-key-change-in-production
      - SECURITY_STRICT_MODE=true
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      # Share the rate-limit window across workers via Redis (swappable backend).
      - RATE_LIMIT_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      # Export traces to Jaeger over OTLP/HTTP (view them at http://localhost:16686).
      - TRACING_ENABLED=true
      - OTEL_EXPORTER=otlp
      - OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=aegis-rag
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      # Mount source for live reload during development.
      - ./src:/app/src:ro
    networks:
      - aegis-net
    restart: unless-stopped

  # Demo web console (React SPA served by nginx, which reverse-proxies /api to
  # the API — so the browser sees a single origin at http://localhost:8080).
  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - aegis-net
    restart: unless-stopped

  chromadb:
    # Must match the chromadb client version resolved in uv.lock (1.5.x); an
    # older server rejects the client's collection API with KeyError('_type').
    image: chromadb/chroma:1.5.9
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - aegis-net
    healthcheck:
      # The chroma 1.5.x image is near-distroless: no curl, wget, or python on
      # PATH — only bash. Probe the HTTP heartbeat with bash's built-in /dev/tcp
      # and assert a real 200, so `condition: service_healthy` gates the API
      # start on Chroma actually answering, not merely the port being open.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/localhost/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - aegis-net
    # Pull the default model on first startup.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull llama3.2 && wait"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Not published to the host — only the API needs it, over the internal network.
    volumes:
      - redis-data:/data
    networks:
      - aegis-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Tracing backend ─────────────────────────────────────────────────────────
  # Jaeger all-in-one receives OTLP spans from the API and serves the trace UI.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      # OTLP receivers (4317 gRPC / 4318 HTTP) stay on the internal network.
    networks:
      - aegis-net
    restart: unless-stopped

  # ── Observability stack ─────────────────────────────────────────────────────
  # Prometheus scrapes the API /metrics endpoint; Grafana ships with a
  # pre-provisioned dashboard and Prometheus datasource, so `docker compose up`
  # yields a fully working monitoring view at http://localhost:3000.

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - aegis-net
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - aegis-net
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  chroma-data:
  ollama-models:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  aegis-net:
    driver: bridge
