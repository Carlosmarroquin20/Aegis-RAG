# Shared proxy settings for the API locations in nginx.conf.

# Above the API's own LLM timeout (LLM_TIMEOUT_SECONDS, 60 s), so the API and
# not the proxy decides that a request has taken too long.
proxy_read_timeout 90s;
proxy_send_timeout 90s;

proxy_pass http://127.0.0.1:8000;
proxy_set_header Host $host;
proxy_set_header X-Request-ID $request_id;

# The API already sends these; without hiding the upstream copies the
# server-level add_header lines would emit each header twice.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
