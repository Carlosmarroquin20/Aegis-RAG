# nginx for the single-container demo image.
#
# Runs as the image's unprivileged user (Hugging Face Spaces runs containers as
# UID 1000), so every path nginx writes to lives under /tmp, and it listens on
# 7860, the port the Space declares (app_port in README.md). It serves the SPA
# and forwards only the API paths the console uses to uvicorn on loopback.
# Anything else, /metrics included, is answered by the SPA, never the API.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;            # the API writes its own structured access log
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # The console only sends small JSON queries; uploads are disabled here.
    client_max_body_size 64k;

    server {
        listen 7860;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # The Space page on huggingface.co shows the app in an iframe, so the
        # frame-DENY of the compose frontend would leave it blank; framing is
        # allowed for that origin only. The bundle has no inline script or style.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors https://huggingface.co" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors https://huggingface.co" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Read-only corpus, enforced here as well as by the API
        # (DOCUMENT_WRITES_ENABLED=false): uploads and deletes never reach it.
        location /api/v1/documents {
            limit_except GET {
                deny all;
            }
            include /etc/nginx/aegis-proxy.conf;
        }

        location ~ ^/(api|health|ready)(/|$) {
            include /etc/nginx/aegis-proxy.conf;
        }
    }
}
