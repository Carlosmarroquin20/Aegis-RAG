---
# Alert rules for the Aegis-RAG service.
#
# These rules operate on the metrics exposed at /metrics and are evaluated
# every 15s. Thresholds assume a development baseline; adjust for production
# workloads based on observed SLOs.

groups:
  - name: aegis-rag.availability
    interval: 30s
    rules:
      - alert: AegisHighErrorRate
        expr: |
          (
            sum(rate(aegis_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(aegis_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Aegis-RAG 5xx error rate above 5%"
          description: >
            More than 5% of requests are returning 5xx for the last 5 minutes.
            Check application logs and upstream (ChromaDB, Ollama) availability.

      - alert: AegisAPIDown
        expr: up{job="aegis-rag"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Aegis-RAG scrape target is down"
          description: "Prometheus has failed to scrape /metrics for 2 minutes."

  - name: aegis-rag.latency
    interval: 30s
    rules:
      - alert: AegisHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(aegis_http_request_duration_seconds_bucket[5m]))
          ) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Aegis-RAG p95 latency above 5s"
          description: >
            Sustained p95 latency > 5s usually indicates an LLM generation
            bottleneck or an under-provisioned embedding step.

      - alert: AegisLongGCPauses
        # Startup freezes its heap so full collections stay short. Pauses this
        # long mean something now builds large long-lived state after startup,
        # and every request in flight waits for each of them.
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(aegis_gc_pause_seconds_bucket{generation="2"}[10m]))
          ) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Aegis-RAG garbage-collection pauses above 250 ms"
          description: >
            Full collections are stopping the process for more than 250 ms
            (p99 over 10 minutes). Compare aegis_gc_pause_seconds before and
            after the last deploy; see infrastructure/observability/runtime.py.

  - name: aegis-rag.security
    interval: 30s
    rules:
      - alert: AegisSecurityViolationSpike
        expr: sum(rate(aegis_security_violations_total[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sustained security violation spike"
          description: >
            Aegis-RAG is blocking queries at more than 0.2/s for 5 minutes.
            Review aegis_security_rule_triggers_total to identify which
            injection signatures are firing.

      - alert: AegisOutputReflectionDetected
        expr: increase(aegis_output_reflections_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LLM output reflection detected"
          description: >
            The OutputSanitizer blocked at least one LLM response that
            echoed an injection payload. Investigate the indexed documents
            for indirect prompt injection.

      - alert: AegisTenantTokenBudgetExhausted
        # Not an incident: the budget is doing its job. It tells the platform
        # team a tenant is being refused, before the tenant files a ticket.
        expr: sum by (tenant) (increase(aegis_token_budget_rejections_total[15m])) > 0
        labels:
          severity: info
        annotations:
          summary: "Tenant {{ $labels.tenant }} has used its daily token budget"
          description: >
            Queries from {{ $labels.tenant }} are answered 429 until 00:00 UTC.
            Raise daily_token_budget in the tenants file if the usage is
            expected; check aegis_llm_tokens_total{client="{{ $labels.tenant }}"}
            if it is not.

      - alert: AegisTokenLedgerUnavailable
        expr: increase(aegis_token_ledger_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Token ledger unreachable"
          description: >
            Daily token budgets are not being checked or charged, so queries
            are served without a cost limit. The ledger uses the rate-limit
            Redis; see AegisRateLimitBackendDown.

      - alert: AegisRateLimitBackendDown
        expr: increase(aegis_rate_limit_backend_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Rate-limit store unreachable"
          description: >
            The API cannot reach its rate-limit backend (Redis). With
            RATE_LIMIT_FAIL_OPEN=true requests are being served WITHOUT
            throttling; with false they are being refused with 503.
            Restore Redis or switch RATE_LIMIT_BACKEND to memory.

      - alert: AegisLLMCircuitOpen
        expr: max by (provider) (aegis_llm_circuit_open) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM backend {{ $labels.provider }} has been skipped for 5 minutes"
          description: >
            Its circuit breaker is open: it failed repeatedly or rate limited
            the key, and queries are being answered by the fallback backend,
            usually slower. Check llm.backend_failed in the API log for the
            reason, and aegis_llm_fallbacks_total for how much traffic moved.

      - alert: AegisAuthFailureSpike
        expr: sum(rate(aegis_auth_failures_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sustained authentication failures"
          description: >
            More than one request per second has been refused at
            authentication for 5 minutes. outcome="rejected" is a bad or
            missing key; outcome="throttled" means a client address is
            locked out and still trying. Check the auth.rejected /
            auth.throttled log lines for the source address.
