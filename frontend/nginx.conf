# nginx config for the Aegis-RAG frontend container.
#
# Serves the built SPA and reverse-proxies API paths to the `api` service so the
# browser talks to a single origin (no CORS needed in the compose network).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in the Server header or on error pages.
    server_tokens off;

    # Baseline hardening for the SPA's own responses. The API sets its own
    # (stricter) headers on everything under the proxied location below.
    #
    # nginx does not merge add_header across levels: a location that declares
    # any add_header of its own drops the ones inherited from here, which is why
    # /assets/ repeats them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets with a long cache; index.html is always revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API. `api` resolves on the compose network.
    location ~ ^/(api|health|ready|metrics)(/|$) {
        # Matches the API's 50 MB ingestion ceiling (_MAX_UPLOAD_BYTES). nginx
        # defaults to 1 MB, which rejected ordinary PDFs with a 413 before they
        # reached the API; conversely this is what stops an oversized body from
        # being streamed to the backend at all.
        client_max_body_size 50m;

        # Generation on CPU routinely takes tens of seconds and the API allows the
        # model up to OLLAMA_TIMEOUT_SECONDS (120). nginx gives an upstream 60 s by
        # default, so a slow-but-successful answer was cut off with a 504 from the
        # proxy. Keep this above the API's own timeout so the API, not nginx, is
        # the one that decides a request has taken too long.
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API already sends these; without hiding the upstream copies the
        # server-level add_header lines above would emit each header twice.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }
}
