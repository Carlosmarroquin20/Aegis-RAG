name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Mypy
        run: uv run mypy src/

  security-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pip-audit
        # Audit the installed environment rather than an exported requirements
        # file: torch is pinned to a CPU-only build (2.x+cpu) that lives on the
        # PyTorch index, not PyPI, so a requirements-file audit cannot resolve it.
        # Auditing the synced venv reads installed metadata directly and avoids
        # re-resolution.
        #
        # ChromaDB carries four advisories (PYSEC-2026-311, CVE-2026-45830,
        # CVE-2026-45831, CVE-2026-45833) with no fixed upstream release. They are
        # formally risk-accepted and documented in SECURITY.md: ChromaDB is an
        # internal-only dependency never exposed to untrusted clients, and Aegis
        # runs single-tenant with a fixed embedding model, so none of the vectors
        # are reachable. Remove these ignores once an upstream fix ships.
        run: |
          uv run pip-audit \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/unit/ -v --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --target runtime -t aegis-rag:ci .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aegis-rag:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          scanners: vuln
          # Fail only on vulnerabilities we can actually remediate. Advisories
          # with no upstream fix are dropped by ignore-unfixed and tracked in
          # SECURITY.md; specific fixed-but-not-applicable ones are listed in
          # .trivyignore. See SECURITY.md for the full policy and rationale.
          ignore-unfixed: true
          trivyignores: .trivyignore
          timeout: 10m
