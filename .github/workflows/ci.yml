name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least privilege: every job only needs to read the repository. Without this
# block the token inherits the repository default, which can include write
# access to contents, packages and pull requests.
permissions:
  contents: read

# A newer push to the same ref makes the older run irrelevant; cancel it rather
# than let both hold runners (the image build alone is several minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same uv as the Dockerfile's UV_VERSION, so CI resolves the lockfile with the
  # exact tool that builds the image instead of whatever is latest that day.
  UV_VERSION: "0.12.9"

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Mypy
        run: uv run mypy src/ scripts/

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Keep in step with the builder stage of frontend/Dockerfile, so the
          # type-check runs on the same Node major that produces the bundle.
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check and build
        run: npm run build
        working-directory: frontend

      - name: Build frontend image
        # The steps above build the SPA with the runner's Node, which says nothing
        # about frontend/Dockerfile: its Node and nginx base images are only
        # exercised by actually building it. Without this, a base-image bump
        # would pass CI untested.
        run: docker build -t aegis-frontend:ci frontend

      - name: Validate nginx config
        # Run nginx's own parser from the image just built, so the config is
        # checked against the exact nginx version that will serve it. `api` is
        # the compose-network upstream; give it a dummy address because nginx
        # resolves proxy_pass hosts at load time.
        run: docker run --rm --add-host api:127.0.0.1 aegis-frontend:ci nginx -t

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, not just the tip: a secret removed in a later
          # commit is still published in the one that added it.
          fetch-depth: 0

      - name: Scan the full history with gitleaks
        # Same tool, version and .gitleaks.toml as the pre-commit hook. The hook
        # is the fast path; this is the one that cannot be skipped.
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.8.0"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        # No backend and no credentials: this downloads the providers pinned in
        # .terraform.lock.hcl and type-checks the configuration against them. It
        # never contacts AWS, and it is what makes a provider upgrade reviewable.
        run: |
          terraform init -backend=false -input=false
          terraform validate

  stack-smoke:
    name: Compose Stack Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Start backing services
        # Everything in the compose file except the API and Ollama, which need an
        # image build and a multi-gigabyte model. --no-deps stops compose from
        # pulling those in through depends_on. This is the only place the pinned
        # image versions and the provisioning under infra/ are actually run.
        run: >
          docker compose up -d --no-deps --wait --wait-timeout 180
          redis chromadb jaeger otel-collector prometheus grafana

      - name: Check the services answer
        run: |
          set -euo pipefail
          retry() { for _ in $(seq 1 30); do "$@" && return 0; sleep 2; done; "$@"; }

          docker compose exec -T redis redis-cli ping | grep -q PONG
          retry curl -fsS http://127.0.0.1:8001/api/v2/heartbeat > /dev/null
          retry curl -fsS http://127.0.0.1:9090/-/ready > /dev/null
          retry curl -fsS http://127.0.0.1:16686/ > /dev/null
          retry curl -fsS http://127.0.0.1:8889/metrics > /dev/null
          retry curl -fsS http://127.0.0.1:3000/api/health | grep -q '"database": *"ok"'

      - name: Check a span travels from the collector to Jaeger
        # The checks above prove each service is up, not that they are wired
        # together. Send one OTLP span to the collector from inside its network
        # namespace (its receivers are not published to the host) and require it
        # to come out of Jaeger's query API and the span-metrics endpoint.
        run: |
          set -euo pipefail
          trace_id=$(openssl rand -hex 16)
          now=$(date +%s%N)
          payload=$(printf '{"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"ci-smoke"}}]},"scopeSpans":[{"spans":[{"traceId":"%s","spanId":"%s","name":"ci-smoke-span","kind":1,"startTimeUnixNano":"%s","endTimeUnixNano":"%s"}]}]}]}' \
            "$trace_id" "$(openssl rand -hex 8)" "$now" "$((now + 1000000))")
          docker run --rm --network "container:$(docker compose ps -q otel-collector)" \
            curlimages/curl:8.22.0 -fsS -X POST http://127.0.0.1:4318/v1/traces \
            -H 'Content-Type: application/json' -d "$payload"

          found() { curl -fsS "$1" | grep -Eq "$2"; }
          wait_for() { for _ in $(seq 1 30); do found "$@" && return 0; sleep 2; done; found "$@"; }
          wait_for "http://127.0.0.1:16686/api/traces/$trace_id" '"serviceName": *"ci-smoke"'
          wait_for http://127.0.0.1:8889/metrics 'service_name="ci-smoke"'

      - name: Check Prometheus loaded every alert rule
        # A rule file that fails to parse is dropped silently at runtime; the
        # alerts would simply never fire.
        run: |
          set -euo pipefail
          rules=$(curl -fsS http://127.0.0.1:9090/api/v1/rules)
          expected=$(grep -c '^ *- alert:' infra/prometheus/alerts.yml)
          loaded=$(echo "$rules" | grep -o '"type":"alerting"' | wc -l)
          echo "alert rules: expected $expected, loaded $loaded"
          test "$loaded" -eq "$expected"
          ! echo "$rules" | grep -q '"health":"err"'

      - name: Check Grafana provisioned its datasources and dashboards
        run: |
          set -euo pipefail
          datasources=$(curl -fsS -u admin:admin http://127.0.0.1:3000/api/datasources)
          echo "$datasources" | grep -q '"uid":"jaeger"'
          echo "$datasources" | grep -q '"type":"prometheus"'
          dashboards=$(curl -fsS -u admin:admin 'http://127.0.0.1:3000/api/search?type=dash-db')
          expected=$(ls infra/grafana/dashboards/*.json | wc -l)
          found=$(echo "$dashboards" | grep -o '"uid"' | wc -l)
          echo "dashboards: expected $expected, found $found"
          test "$found" -eq "$expected"

      - name: Run the rate-limit store tests against the real Redis
        # The unit suite uses fakeredis. This runs the same behaviour against the
        # Redis image pinned in docker-compose.yml.
        run: |
          set -euo pipefail
          redis_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q redis)")
          uv sync --dev
          AEGIS_TEST_REDIS_URL="redis://${redis_ip}:6379/0" \
            uv run pytest tests/integration/test_redis_store_live.py --no-cov -q -rs

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 80

  security-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pip-audit
        # Audit the installed environment rather than an exported requirements
        # file: torch is pinned to a CPU-only build (2.x+cpu) that lives on the
        # PyTorch index, not PyPI, so a requirements-file audit cannot resolve it.
        # Auditing the synced venv reads installed metadata directly and avoids
        # re-resolution.
        #
        # ChromaDB carries four advisories (PYSEC-2026-311, CVE-2026-45830,
        # CVE-2026-45831, CVE-2026-45833) with no fixed upstream release. They are
        # formally risk-accepted and documented in SECURITY.md: ChromaDB is an
        # internal-only dependency never exposed to untrusted clients, and Aegis
        # runs single-tenant with a fixed embedding model, so none of the vectors
        # are reachable. Remove these ignores once an upstream fix ships.
        run: |
          uv run pip-audit \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        # Unit + integration (both hermetic; integration uses in-memory fakes).
        # The coverage gate (fail_under) is enforced here via the default addopts.
        run: uv run pytest tests/unit tests/integration -v --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build --target runtime -t aegis-rag:ci .

      - name: Scan image for vulnerabilities
        # Pinned to a full commit SHA, not a branch or tag. This action runs with
        # access to the built image and the job token, and its tags have been
        # force-moved to malicious commits before; a SHA cannot be repointed.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aegis-rag:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          scanners: vuln
          # Fail only on vulnerabilities we can actually remediate. Advisories
          # with no upstream fix are dropped by ignore-unfixed and tracked in
          # SECURITY.md; specific fixed-but-not-applicable ones are listed in
          # .trivyignore. See SECURITY.md for the full policy and rationale.
          ignore-unfixed: true
          trivyignores: .trivyignore
          timeout: 10m
