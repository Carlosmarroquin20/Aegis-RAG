name: OpenSSF Scorecard

# Scores the repository's supply-chain practices (branch protection, pinned
# dependencies, token permissions, signed releases, ...) with the OpenSSF
# Scorecard checks. The findings go to the Security tab; the published score
# backs the README badge, so a regression in any practice is visible to anyone
# evaluating the project, not only to its maintainers.
#
# publish_results imposes restrictions on this workflow: no top-level env or
# defaults, and only a short list of allowed actions in the job. Keep it lean.

on:
  push:
    branches: [main]
  # Branch protection is one of the scored checks; re-score when it changes.
  branch_protection_rule:
  schedule:
    - cron: "41 6 * * 1"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF results
      id-token: write # sign the published results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
