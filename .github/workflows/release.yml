name: Release images

# Publishes the API and frontend images to GitHub Container Registry for every
# GitHub release, with the evidence a consumer needs to trust them:
#
#   - a keyless Sigstore signature (cosign), tied to this workflow's identity
#     through GitHub's OIDC token, so there is no signing key to leak or rotate;
#   - a SLSA build provenance attestation (actions/attest-build-provenance),
#     stating which commit and which workflow run produced the digest;
#   - an SPDX SBOM, attached to the image by BuildKit and to the release as a
#     file, so the components can be audited without pulling the image.
#
# Everything refers to the image by digest: a tag can be moved, a digest cannot.
# A manual run (workflow_dispatch) publishes the current commit as "edge" and
# "sha-<commit>", to exercise the pipeline between releases.
#
# The images are built for linux/amd64 only: torch comes from the CPU-only
# PyTorch index, and an emulated arm64 build of it would take hours.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never abandon a half-published release

jobs:
  image:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOM to the release
      packages: write # push to ghcr.io
      id-token: write # OIDC token for keyless signing and attestations
      attestations: write # store the provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            target: runtime
          - name: frontend
            context: frontend
            target: runtime
    env:
      IMAGE: ghcr.io/carlosmarroquin20/aegis-rag-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Release: 1.2.3, 1.2 and latest. Manual run: edge. Both: sha-<commit>.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=long
          flavor: |
            latest=${{ github.event_name == 'release' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit's own SBOM and provenance travel with the image in the
          # registry, as attestation manifests next to it.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate the SBOM file
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: aegis-rag-${{ matrix.name }}.spdx.json
          artifact-name: aegis-rag-${{ matrix.name }}.spdx.json
          # Attached to the GitHub release when the run comes from one.
          upload-release-assets: ${{ github.event_name == 'release' }}

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo '```bash'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
